version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditrace
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: auditrace
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: auditrace
      MINIO_ROOT_PASSWORD: changeme
    ports:
      - "9000:9000"
      - "9001:9001"
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"

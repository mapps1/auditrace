[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditrace"
version = "0.1.0"
description = "Tamper-evident AI audit trails for EU AI Act, SOC 2, and HIPAA compliance"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Auditrace Contributors" }]
keywords = [
  "ai-governance", "audit-trail", "eu-ai-act", "soc2", "hipaa",
  "compliance", "llm", "openai", "anthropic", "langchain"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "cryptography>=42.0.0",
  "jinja2>=3.1.0",
  "rich>=13.0.0",
  "tomli>=2.0.0;python_version<'3.11'",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
s3 = ["boto3>=1.34.0"]
pdf = ["weasyprint>=61.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
litellm = ["litellm>=1.40.0"]
langchain = ["langchain>=0.2.0"]
serve = ["fastapi>=0.111.0", "uvicorn[standard]>=0.29.0"]
all = [
  "auditrace[postgres,s3,pdf,openai,anthropic,litellm,langchain,serve]"
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[project.scripts]
auditrace = "auditrace.cli.main:app"

[project.urls]
Homepage = "https://github.com/auditrace/auditrace"
Documentation = "https://auditrace.github.io/auditrace"
Repository = "https://github.com/auditrace/auditrace"
Issues = "https://github.com/auditrace/auditrace/issues"
Changelog = "https://github.com/auditrace/auditrace/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=auditrace --cov-report=term-missing --cov-fail-under=80"

[tool.hatch.build.targets.wheel]
packages = ["auditrace"]
